# Day 4 - Covers GitHub Actions Expressions, Contexts, Conditions and Status Check Functions
name: Day 04 – Condition and Status Functions

# -------- [A] ------------- Example 1 : Conditions ------------------------
on:
  workflow_dispatch:

env:
  DEPLOY_ENV: production

jobs:
  deployment:
    runs-on: ubuntu-latest

    steps:
      # Using if condition
      - name: Production Deployment
        if: env.DEPLOY_ENV == 'production'
        run: |
          echo "Deploying to Production..."
          echo "APP URL : $DEPLOY_ENV"

      # Using if condition
      - name: Development Deployment
        if: env.DEPLOY_ENV == 'development'
        run: |
          echo "Deploying to Development..."
          echo "APP URL : $DEPLOY_ENV"

      # Using Ternary-like condition  -->  ${{ condition && 'True Value' || 'False Value' }}
      - name: Ternary Decision
        run: echo "${{env.DEPLOY_ENV == 'production' && 'https://prod.example.com' || 'https://dev.example.com'}}"

