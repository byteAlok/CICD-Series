# ------------ [C] -------------- Example 1 : Status Check Functions -------------------------------

  status-check-1:
    runs-on: ubuntu-latest

    steps:
      - name: Successful Step
        run: echo "Step executed successfully"

      - name: Success Function
        if: success()
        run: echo "Previous steps succeeded"

      - name: Failure Function
        if: failure()
        run: echo "Previous step failed"

      - name: Always Function
        if: always()
        run: echo "This step always runs"

      - name: Cancelled Function
        if: cancelled()
        run: echo "Workflow was cancelled"


# ------------- [D] ------------- Example 2 : Status Check Functions -------------------------------

  status-check-2:
    runs-on: ubuntu-latest

    steps:
      - name: Build Application

        # Exit Code 1 - Manually generating failure
        # Exit Code 0 - Successful execution (normally returned automatically)
        run: |
          echo "Building Application..."
          exit 1

      - name: Build Success
        if: success()
        run: echo "Build Successful"

      - name: Build Failed
        if: failure()
        run: echo "Build Failed! Sending Notification..."

      - name: Cleanup
        if: always()
        run: echo "Performing Cleanup..."

