# Automatically runs workflows on code pushes, pull requests, or manual triggers using Ubuntu, Windows, and macOS runners.
name: Day 02 - Triggers runners

# Workflow Triggers
on: 

  # Automatically trigger on every push 
  push:

    # Type 1: Automatically trigger on every push to main OR test
    # branches:
    #   - main
    #   - test
      
    # Type 2: Automatically trigger on every push to main branch of this paths --> Azure-DevOps/** OR GitLab-CICD/** 
    branches:
      - main
    paths:
      - 'Azure-DevOps/**'
      - 'GitLab-CICD/**'

    # Type 3: Automatically trigger on every push to ANY Branches --> Excluding => test/**
    # branches:
    #   - '**'
    #   - '!test/**'

  # Trigger when a PR (pull_request) targets main 
  # pull_request:
  #   branches:
  #     - main
  #   types:
  #     - opened
  #     - synchronize
  #     - reopened
      
  # Manually trigger from GitHub Actions dashboard
  workflow_dispatch: 
    
# Minimum required permissions
permissions: 
  contents: read

jobs:

  # Job 1 - GitHub-hosted Ubuntu runner -----------------------
  runner_information_ubuntu:
    name: Runner Information Ubuntu
    runs-on: ubuntu-latest

    steps:
    
      # Step 1
      - name: Welcome Message
        run: echo "Day 2 - Ubuntu Runner"

      # Step 2
      - name: Runner Information
        run: |
          echo "Runner Name: "
          echo "$RUNNER_NAME"
          echo "Runner OS: "
          echo "$RUNNER_OS"

  # Job 2 - GitHub-hosted Windows runner --------------------------
  runner_information_windows:
    name: Runner Information Windows
    runs-on: windows-latest
  
    steps:

      # Step 1
      - name: Welcome Message
        run: echo "Day 2 - Windows Runner"

      # Step 2
      - name: Runner Information
        run: |
          echo "Runner Name: "
          echo "$env:RUNNER_NAME"
          echo "Runner OS: "
          echo "$env:RUNNER_OS"
        shell: pwsh
    
  # Job 2 - GitHub-hosted Mac OS runner ----------------------------
  runner_information_macos:
    name: Runner Information MacOS
    runs-on: macos-latest

    steps:

      # Step 1
      - name: Welcome Message
        run: echo "Day 2 - macOS Runner"

      # Step 2
      - name: Runner Information
        run: |
          echo "Runner Name: "
          echo "$RUNNER_NAME"
          echo "Runner OS: "
          echo "$RUNNER_OS"
          
