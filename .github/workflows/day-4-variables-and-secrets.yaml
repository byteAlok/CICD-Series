# Day 4 - Covers Repository and Environment Variables, Secrets, and their usage in GitHub Actions jobs and steps.
name: Day 04 - Repository and Environment Variables & Secrets

on:
  workflow_dispatch:

jobs:
  # ============ [1] ===================== Actions --> Variables --> Repository variables ======================================
  repository-variables:  # Custom Job ID (we can use any valid name, it is not predefined)
    name: Repository Variables
    runs-on: ubuntu-latest
    
    # --> Settings --> Secrets and variables --> Actions --> Variables --> Repository variables 
    steps:
      - name: Display Repository Variables
        run: |
          echo "Application Environment: ${{vars.APP_ENV}}"
          echo "AWS Region: ${{ vars.AWS_REGION }}"
          echo "Instance Type: ${{ vars.INSTANCE_TYPE }}"

  # ============ [2] ==================== Actions --> Variables --> Environments variables =====================================
  
  environment-variables:  # Custom Job ID
    name: Environment Variables
    runs-on: ubuntu-latest
    
    # --> Settings --> Environments --> Select (New environment/Existing) --> Enter environment name --> Configure environment
    # --> Environment variables --> Add environment variable
    # OR ---------------------------------------------------------------------------------------------------
    # --> Settings --> Secrets and variables --> Actions --> Variables --> Environments variables
    # --> Manage environments variables (Select --> New environment/Existing) --> Enter environment name --> Configure environment
    # --> Environment variables --> Add environment variable
    
    environment: development    # Select GitHub Environment (Required to access Environment-level Variables and Secrets)

    steps:
      - name: Display Environment Variables
        run: |
          echo "Application Environment: ${{ vars.APP_ENV }}"
          echo "Database Name: ${{ vars.DATABASE_NAME }}"

  #-------------------------------------------------------------------------------------------------------------------------
  # ============= [3] ==================== Actions --> Secrets --> Repository secrets ======================================

  repository-secrets:  # Custom Job ID
    name: Repository Secrets
    runs-on: ubuntu-latest

    # --> Settings --> Secrets and variables --> Actions --> Secrets --> Repository secrets --> New repository secrets
    steps:
    
      # Method 1: Direct access using GitHub Expression ------------------------------
      - name: Access Repository Secrets

        # Directly use Secrets here
        run: |
          echo "Database Password: ${{ secrets.DB_PASSWORD }}"
          echo "API Token: ${{ secrets.API_TOKEN }}"

      # Method 2: Using Step-level Environment Variables -----------------------------
      - name: Access Repository Secrets

        # First, store Secrets in Environment Variables 
        env:
          DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}  # GitHub Expression Context
          API_TOKEN: ${{ secrets.API_TOKEN }}            # GitHub Expression Context

        # Then, use Environment Variables here
        run: |
          echo "Database Password: $DATABASE_PASSWORD"  
          echo "API Token: $API_TOKEN"

  # ============ [4] ==================== Actions --> Secrets --> Environment secrets =====================================

  environment-secrets:  # Custom Job ID
    name: Environment Secrets
    runs-on: ubuntu-latest

    # --> Settings --> Environments --> Select (New environment/Existing) --> Enter environment name --> Configure environment
    # --> Environment secrets --> Add environment secret
    # OR --------------------------------------------------------------------------------------------------
    # --> Settings --> Secrets and variables --> Actions --> Secrets --> Environments secrets
    # --> Manage environments secrets (Select --> New environment/Existing) --> Enter environment name --> Configure environment
    # --> Environment secrets --> Add environment secret

    environment: development  # Select GitHub Environment (Required to access Environment-level Variables and Secrets)

    steps:
      - name: Access Environment Secrets

        # First, store Secrets in Environment Variables
        env:
          DATABASE_PASSWORD: ${{ secrets.ENV_DB_PASSWORD }}  # GitHub Expression Context
          API_KEY: ${{ secrets.ENV_API_KEY }}                # GitHub Expression Context

        # Then, use Environment Variables here
        run: |
          # Learning purpose only - Never print actual Secrets in production.
          echo "Database Password: $DATABASE_PASSWORD"
          echo "API Key: $API_KEY"

# ==============================================================================================================================

# NOTE:

# The second method used in Section [3] (mapping values using step-level `env:`)
# can also be used in Sections [1], [2], and [4] whenever required.
# First, map Repository/Environment Variables or Secrets to environment (env) variables

# ------- Example ------------------------------------------------------------
# env:
#   DATABASE_PASSWORD: ${{ secrets.DB_PASSWORD }}  # GitHub Expression Context
#   API_TOKEN: ${{ secrets.API_TOKEN }}            # GitHub Expression Context
# ----------------------------------------------------------------------------

# using GitHub Expressions, then access them inside the `run` script.
# This method is optional and can be used whenever you need to access these values
# as environment variables instead of directly using GitHub Expressions.



          
